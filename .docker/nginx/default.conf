# Referrer-Policy default: supply it only when the application has not. nginx's add_header APPENDS to an upstream header rather than
# replacing it, and a browser applies the LAST of several values, so an unconditional default overrode the application's `no-referrer` on
# the invitation pages (the token-bearing URL then went out as a same-origin Referer and into the access log). An empty value makes
# add_header emit nothing. Pages that set their own policy keep exactly that one.
map $sent_http_referrer_policy $default_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

server {
    listen 80;
    server_name localhost;
    root /var/www/app/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy $default_referrer_policy;

    # Max upload size
    client_max_body_size 30M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    charset utf-8;

    # Static assets — Vite outputs content-hashed filenames so long-lived cache is safe
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Main entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to sensitive Laravel directories
    location ~* ^/(storage|bootstrap/cache) {
        deny all;
        return 404;
    }
}
