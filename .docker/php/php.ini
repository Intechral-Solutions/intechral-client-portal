[PHP]
; Error reporting (dev — verbose)
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/www/portal/storage/logs/php-errors.log

; Performance
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Uploads
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20

; OPcache (dev — no caching, immediate reloads)
opcache.enable = 1
opcache.enable_cli = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

; Date
date.timezone = UTC
