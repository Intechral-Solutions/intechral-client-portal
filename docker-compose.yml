name: intechral-portal

services:
  # ── PHP-FPM (Laravel) ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: portal_app
    user: root
    restart: unless-stopped
    ports:
      - "5173:5173"
    # R0.9-CS1: the dev stack keeps the pre-boundary customer behaviour (APP_ENV=local, the only environment that
    # honours "legacy") so the browser suite's customer specs keep their meaning. A real environment variable beats
    # src/.env. Start the stack with PORTAL_CUSTOMER_SURFACE_MODE=pilot (or closed) in the host environment to run the
    # pilot specs: docs/testing/e2e-browser-suite.md.
    environment:
      PORTAL_CUSTOMER_SURFACE_MODE: ${PORTAL_CUSTOMER_SURFACE_MODE:-legacy}
    volumes:
      - ./src:/var/www/app
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./.docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

  # ── Nginx ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: portal_nginx
    restart: unless-stopped
    ports:
      - "4242:80"
    volumes:
      - ./src:/var/www/app:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portal

  # ── MariaDB 11.4 ─────────────────────────────────────────
  # Pinned to the production patch version (Namecheap: 11.4.13). The data lives in `dbdata114`, a volume created
  # for this version. The MariaDB 10.11 volume `intechral-portal_dbdata` is intentionally no longer declared here: it is
  # kept untouched as the rollback source and `docker compose down -v` cannot remove what Compose does not know.
  # Moving an existing machine across is a dump and restore, never an in-place upgrade:
  # docs/architecture/docker-setup.md "MariaDB 11.4 transition".
  db:
    image: mariadb:11.4.13
    container_name: portal_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal
    volumes:
      - dbdata114:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./.docker/mysql/init-testing.sql:/docker-entrypoint-initdb.d/init-testing.sql:ro
      - ./.docker/mysql/init-rehearsal.sql:/docker-entrypoint-initdb.d/init-rehearsal.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portal

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    networks:
      - portal

  # ── Mailpit (email testing) ──────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: portal_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - portal

  # ── Queue worker ─────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: portal_queue
    user: portal
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www/app
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  dbdata114:
    driver: local
  redisdata:
    driver: local
