name: intechral-portal

services:
  # ── PHP-FPM (Laravel) ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: portal_app
    user: root
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./src:/var/www/app
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./.docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

  # ── Nginx ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: portal_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/app:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portal

  # ── MariaDB 10 ───────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: portal_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal
    volumes:
      - dbdata:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./.docker/mysql/init-testing.sql:/docker-entrypoint-initdb.d/init-testing.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portal

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    networks:
      - portal

  # ── Mailpit (email testing) ──────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: portal_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - portal

  # ── Queue worker ─────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: portal_queue
    user: portal
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www/app
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
